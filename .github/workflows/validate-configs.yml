name: Indigo-EVE Configuration Validation

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate YAML files
        run: |
          echo "Validating YAML configuration files..."
          python -c "
          import yaml
          import sys
          from pathlib import Path
          
          errors = []
          yaml_files = list(Path('assistants').glob('*.yaml')) + list(Path('assistants').glob('*.yml'))
          
          for yaml_file in yaml_files:
              try:
                  with open(yaml_file, 'r') as f:
                      yaml.safe_load(f)
                  print(f'✓ {yaml_file} is valid')
              except yaml.YAMLError as e:
                  errors.append(f'✗ {yaml_file}: {e}')
                  print(f'✗ {yaml_file}: {e}')
          
          if errors:
              sys.exit(1)
          print('\nAll YAML files are valid!')
          "

      - name: Validate JSON files
        run: |
          echo "Validating JSON configuration files..."
          python -c "
          import json
          import sys
          from pathlib import Path
          
          errors = []
          json_files = list(Path('assistants').glob('*.json'))
          
          for json_file in json_files:
              try:
                  with open(json_file, 'r') as f:
                      json.load(f)
                  print(f'✓ {json_file} is valid')
              except json.JSONDecodeError as e:
                  errors.append(f'✗ {json_file}: {e}')
                  print(f'✗ {json_file}: {e}')
          
          if errors:
              sys.exit(1)
          print('\nAll JSON files are valid!')
          "

      - name: Check for template variables
        run: |
          echo "Checking for unresolved template variables..."
          python -c "
          import re
          import sys
          from pathlib import Path
          
          # Check assistant configs for required variables
          config_files = list(Path('assistants').glob('*.yaml')) + list(Path('assistants').glob('*.json'))
          
          warnings = []
          for config_file in config_files:
              with open(config_file, 'r') as f:
                  content = f.read()
                  variables = re.findall(r'{{(\w+)}}', content)
                  if variables:
                      print(f'ℹ {config_file} contains template variables: {set(variables)}')
                      warnings.append(config_file)
          
          if warnings:
              print('\n⚠ Template variables found. Ensure these are replaced during deployment.')
          else:
              print('\n✓ No template variables in configuration files')
          "

      - name: Validate directory structure
        run: |
          echo "Validating directory structure..."
          python -c "
          import sys
          from pathlib import Path
          
          required_dirs = ['assistants', 'prompts', 'knowledge', '.github/workflows']
          required_files = [
              'README.md',
              'assistants/README.md',
              'prompts/README.md',
              'knowledge/README.md'
          ]
          
          errors = []
          
          for dir_path in required_dirs:
              if not Path(dir_path).is_dir():
                  errors.append(f'✗ Missing required directory: {dir_path}')
              else:
                  print(f'✓ Directory exists: {dir_path}')
          
          for file_path in required_files:
              if not Path(file_path).is_file():
                  errors.append(f'✗ Missing required file: {file_path}')
              else:
                  print(f'✓ File exists: {file_path}')
          
          if errors:
              for error in errors:
                  print(error)
              sys.exit(1)
          
          print('\n✓ All required directories and files are present!')
          "

  validate-prompts:
    name: Validate Prompt Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check prompt files exist
        run: |
          echo "Checking prompt files..."
          for prompt in prompts/*.md; do
            if [ -f "$prompt" ]; then
              echo "✓ Found: $prompt"
            fi
          done

      - name: Validate prompt structure
        run: |
          echo "Validating prompt file structure..."
          python -c "
          import sys
          from pathlib import Path
          
          prompt_files = list(Path('prompts').glob('*.md'))
          
          for prompt_file in prompt_files:
              with open(prompt_file, 'r') as f:
                  content = f.read()
                  
                  # Check for basic structure
                  if '# ' in content:
                      print(f'✓ {prompt_file} has proper markdown structure')
                  else:
                      print(f'⚠ {prompt_file} may be missing proper headers')
          
          print('\n✓ Prompt validation complete!')
          "

  validate-knowledge:
    name: Validate Knowledge Base
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check knowledge base structure
        run: |
          echo "Validating knowledge base structure..."
          python -c "
          import sys
          from pathlib import Path
          
          knowledge_dirs = ['knowledge/operations', 'knowledge/brand', 'knowledge/technical', 'knowledge/client-templates']
          
          for kb_dir in knowledge_dirs:
              kb_path = Path(kb_dir)
              if kb_path.is_dir():
                  print(f'✓ Knowledge directory exists: {kb_dir}')
                  readme = kb_path / 'README.md'
                  if readme.is_file():
                      print(f'  ✓ README.md found in {kb_dir}')
                  else:
                      print(f'  ⚠ README.md missing in {kb_dir}')
              else:
                  print(f'✗ Missing knowledge directory: {kb_dir}')
          
          print('\n✓ Knowledge base validation complete!')
          "

  markdown-lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Markdown lint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: node_modules/
        continue-on-error: true

  report-success:
    name: Report Validation Success
    runs-on: ubuntu-latest
    needs: [validate-configs, validate-prompts, validate-knowledge]
    if: success()
    
    steps:
      - name: Success message
        run: |
          echo "✅ All validation checks passed!"
          echo "Framework configuration is valid and ready for deployment."
